services:
  mongo:
    image: mongo:4.4
    container_name: collagegram
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: collagegram
    ports:
      - "27020:27017"
    volumes:
      - mongo_data:/data/db
