stages:
  - build
  - deploy

default:
  tags: ["hamgit-shell"] #

variables:
  DOCKER_HOST: unix:///var/run/docker.sock

build:
  stage: build
  script:
    - echo "🔨 Building Docker images..."

    - mkdir -p apps/api
    - touch apps/api/.env
    - echo "ACCESS_TOKEN_EXPIRES_IN=$ACCESS_TOKEN_EXPIRES_IN" >> apps/api/.env
    - echo "ACCESS_TOKEN_SECRET=$ACCESS_TOKEN_SECRET" >> apps/api/.env
    - echo "APP_STAGE=$APP_STAGE" >> apps/api/.env
    - echo "MONGODB_URI=$MONGODB_URI" >> apps/api/.env
    - echo "MAX_POOL_SIZE=$MAX_POOL_SIZE" >> apps/api/.env
    - echo "MIN_POOL_SIZE=$MIN_POOL_SIZE" >> apps/api/.env
    - echo "PORT=$PORT" >> apps/api/.env
    - echo "NODE_ENV=$NODE_ENV" >> apps/api/.env
    - echo "APP_STAGE=$APP_STAGE" >> apps/api/.env
    - echo "CORS_ORIGIN=$CORS_ORIGIN" >> apps/api/.env
    - echo "SMTP_HOST=$SMTP_HOST" >> apps/api/.env
    - echo "SMTP_PORT=$SMTP_PORT" >> apps/api/.env
    - echo "SMTP_USER=$SMTP_USER" >> apps/api/.env
    - echo "SMTP_PASS=$SMTP_PASS" >> apps/api/.env
    - echo "EMAIL_FROM=$EMAIL_FROM" >> apps/api/.env
    - echo "REDIS_URL=$REDIS_URL" >> apps/api/.env
    - echo "ELASTIC_URL=$ELASTIC_URL" >> apps/api/.env
    - echo "COOKIE_SECRET=$COOKIE_SECRET" >> apps/api/.env

    - mkdir -p apps/web
    - touch apps/web/.env
    - echo "VITE_BASE_URL=$VITE_BASE_URL" >> apps/web/.env
    - echo "VITE_SOCKET_URL=$VITE_SOCKET_URL" >> apps/web/.env
  
    - docker compose -f docker-compose.yaml -f docker-compose.prod.yaml build --no-cache
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
  artifacts:
    paths:
      - apps/api/.env
      - apps/web/.env
    expire_in: never

deploy:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  script:
    - echo "🚀 Deploying..."
    - docker compose -f docker-compose.yaml -f docker-compose.prod.yaml down
    - docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --remove-orphans
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
