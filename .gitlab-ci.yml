stages:
  - test

default:
  tags: ["hamgit-shell"]

hello:
  stage: test
  script:
    - echo "✅ hello from prod-shell-runner on devsync server"
    - echo "current user: $(whoami)"
    - echo "docker version:"
    - docker --version
    - echo "compose version:"
    - docker compose version
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
