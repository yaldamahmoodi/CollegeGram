stages:
  - build
  - deploy

default:
  tags: ["hamgit-shell"]  # use your self-hosted runner

variables:
    DOCKER_HOST: unix:///var/run/docker.sock

# 1. Build Docker images
build:
  stage: build
  script:
    - echo "🔨 Building Docker images..."
    # Create .env files for API
    - mkdir -p apps/api
    - touch apps/api/.env
    - echo "ACCESS_TOKEN_EXPIRES_IN=$ACCESS_TOKEN_EXPIRES_IN" >> apps/api/.env
    - echo "ACCESS_TOKEN_SECRET=$ACCESS_TOKEN_SECRET" >> apps/api/.env
    - echo "APP_STAGE=$APP_STAGE" >> apps/api/.env
    - echo "MONGODB_URI=$MONGODB_URI" >> apps/api/.env
    - echo "MAX_POOL_SIZE=$MAX_POOL_SIZE" >> apps/api/.env
    - echo "MIN_POOL_SIZE=$MIN_POOL_SIZE" >> apps/api/.env
    - echo "PORT=$PORT" >> apps/api/.env
    - echo "NODE_ENV=$NODE_ENV" >> apps/api/.env
    - echo "APP_STAGE=$APP_STAGE" >> apps/api/.env
    - echo "CORS_ORIGIN=$CORS_ORIGIN" >> apps/api/.env
    - echo "SMTP_HOST=$SMTP_HOST" >> apps/api/.env
    - echo "SMTP_PORT=$SMTP_PORT" >> apps/api/.env
    - echo "SMTP_USER=$SMTP_USER" >> apps/api/.env
    - echo "SMTP_PASS=$SMTP_PASS" >> apps/api/.env
    - echo "EMAIL_FROM=$EMAIL_FROM" >> apps/api/.env
    
    # Create .env files for Web
    - mkdir -p apps/web
    - touch apps/web/.env
    - echo "VITE_BASE_URL=$VITE_BASE_URL" >> apps/web/.env

    # Build fresh images
    - docker compose build --no-cache
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'  # build only from prod branch
  artifacts:
    paths:
      - apps/api/.env
      - apps/web/.env
    expire_in: never
# 2. Deploy services
deploy:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  script:
    - echo "🚀 Deploying..."
    - docker compose down
    - docker compose up -d --remove-orphans
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'  # deploy only from prod branch
