stages:
  - install
  - build
  - deploy

default:
  tags: ["hamgit-shell"]

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_BUILDKIT: 1
  DOCKER_CLI_EXPERIMENTAL: enabled
  PNPM_CACHE_FOLDER: .pnpm-store

# Cache dependencies
cache:
  key: 
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/
    - node_modules/
  policy: pull-push

# Install dependencies
install:
  stage: install
  script:
    - echo "📦 Installing dependencies..."
    - npm install -g pnpm@10.14.0
    - pnpm --version
    - pnpm install
  cache:
    key: 
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - node_modules/
    policy: push
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
  artifacts:
    paths:
      - node_modules/
      - .pnpm-store/
    expire_in: 1 hour

build:
  stage: build
  needs: ["install"]
  script:
    - echo "🔨 Building applications..."
    - npm install -g turbo
    - pnpm --version
    - pnpm turbo run build
  cache:
    key: 
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - node_modules/
    policy: pull
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
  artifacts:
    paths:
      - apps/*/dist/
    expire_in: 1 hour

# Build Docker images
build-docker:
  stage: build
  needs: ["build"]
  script:
    - echo "🐳 Building Docker images..."
    
    # Create environment files
    - mkdir -p apps/api apps/web
    - |
      cat > apps/api/.env << EOF
      ACCESS_TOKEN_EXPIRES_IN=$ACCESS_TOKEN_EXPIRES_IN
      ACCESS_TOKEN_SECRET=$ACCESS_TOKEN_SECRET
      APP_STAGE=$APP_STAGE
      MONGODB_URI=$MONGODB_URI
      MAX_POOL_SIZE=$MAX_POOL_SIZE
      MIN_POOL_SIZE=$MIN_POOL_SIZE
      PORT=$PORT
      NODE_ENV=$NODE_ENV
      CORS_ORIGIN=$CORS_ORIGIN
      SMTP_HOST=$SMTP_HOST
      SMTP_PORT=$SMTP_PORT
      SMTP_USER=$SMTP_USER
      SMTP_PASS=$SMTP_PASS
      EMAIL_FROM=$EMAIL_FROM
      REDIS_URL=$REDIS_URL
      ELASTIC_URL=$ELASTIC_URL
      COOKIE_SECRET=$COOKIE_SECRET
      EOF
    - |
      cat > apps/web/.env << EOF
      VITE_BASE_URL=$VITE_BASE_URL
      VITE_SOCKET_URL=$VITE_SOCKET_URL
      EOF
    
    # Build with cache
    - docker compose --profile production build --parallel
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
  artifacts:
    paths:
      - apps/api/.env
      - apps/web/.env
    expire_in: never

# Deploy
deploy:
  stage: deploy
  needs: ["build-docker"]
  script:
    - echo "🚀 Deploying..."
    - docker compose --profile production down
    - docker compose --profile production up -d --remove-orphans
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
