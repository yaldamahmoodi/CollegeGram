stages:
  - build
  - deploy

default:
  tags: [ "hamgit-shell" ]  # use your self-hosted runner

variables:
  DOCKER_HOST: unix:///var/run/docker.sock

# 1. Build Docker images
build:
  stage: build
  script:
    - echo "🔨 Building Docker images..."

    # Create .env file for API
    - mkdir -p apps/api
    - cat > apps/api/.env <<EOL
      ACCESS_TOKEN_EXPIRES_IN=$ACCESS_TOKEN_EXPIRES_IN
      ACCESS_TOKEN_SECRET=$ACCESS_TOKEN_SECRET
      APP_STAGE=$APP_STAGE
      MONGODB_URI=$MONGODB_URI
      MAX_POOL_SIZE=$MAX_POOL_SIZE
      MIN_POOL_SIZE=$MIN_POOL_SIZE
      PORT=$PORT
      NODE_ENV=$NODE_ENV
      EOL

    # Create .env file for Web
    - mkdir -p apps/web
    - cat > apps/web/.env <<EOL
      VITE_BASE_URL=$VITE_BASE_URL
      APP_STAGE=$APP_STAGE
      CORS_ORIGIN=$CORS_ORIGIN
      NODE_ENV=$NODE_ENV
      EOL

    # Build images
    - docker compose build --no-cache
  artifacts:
    paths:
      - apps/api/.env
      - apps/web/.env
    expire_in: 1h   # keep only short-term

# 2. Deploy services
deploy:
  stage: deploy
  dependencies:
    - build   # ensures artifacts are downloaded
  script:
    - echo "🚀 Deploying..."
    - docker compose down
    - docker compose up -d --remove-orphans
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'