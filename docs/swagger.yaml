openapi: 3.0.0
info:
  title: Rahnema
  version: 1.0.0
  description: API documentation for Auth, Users, and Posts
servers:
  - url: http://188.121.102.156
  - url: http://localhost:3001

paths:
  /api/health:
    get:
      summary: Health Check
      responses:
        '200':
          description: OK

  /api/v1/auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: "user@example.com"
                username:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: "username123"
                password:
                  type: string
                  minLength: 8
                  maxLength: 20
                  pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[\\W_]).{8,}$"
                  example: "StrongP@ssw0rd"
                firstname:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: "John"
                lastname:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: "Doe"
                biography:
                  type: string
                  maxLength: 1500
                  nullable: true
                  example: "I am a software developer."
              required:
                - email
                - username
                - password
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "USER_REGISTERED"
                  message:
                    type: string
                    example: "User created successfully"
        '400':
          description: Bad Request – Invalid input
        '500':
          description: Internal Server Error

  /api/v1/auth/login:
    post:
      summary: Login user
      description: Authenticate user and return access token in a HttpOnly cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User logged in successfully
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  userId:
                    type: string
                    example: 64f2a7b9e0c0f123456789ab

  /api/v1/users/profile:
    get:
      summary: Get user profile
      description: |
        برمی‌گردونه اطلاعات پروفایل کاربر.
        - اگر query param `id` ارسال بشه، پروفایل اون کاربر خاص رو برمی‌گردونه.
        - اگر ارسال نشه، پروفایل کاربر لاگین‌شده برگردونده میشه.
      security:
        - cookieAuth: [ ]
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: ID of the user (optional)
      responses:
        '200':
          description: User profile returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: GET_USER_SUCCESSFULLY
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                        example: johndoe
                      email:
                        type: string
                        format: email
                        example: johndoe@example.com
                      biography:
                        type: string
                        example: Software engineer and photographer
                      follower_count:
                        type: integer
                        example: 120
                      following_count:
                        type: integer
                        example: 85
                      post_count:
                        type: integer
                        example: 45
                      profilePhotoUrl:
                        type: string
                        nullable: true
                        example: /uploads/profile/johndoe.png

  /api/v1/users/profile/upload:
    post:
      summary: Upload profile photo
      description: Upload or update the authenticated user's profile photo.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - profile
              properties:
                profile:
                  type: string
                  format: binary
                  description: The profile photo file to upload
      responses:
        '201':
          description: Profile photo uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UPLOADED
                  message:
                    type: string
                    example: Profile upload success
                  data:
                    type: object
                    description: Details of the uploaded profile photo
                    properties:
                      _id:
                        type: string
                        example: 68c3e674d504d2ecea9e341f
                      user_id:
                        type: string
                        example: 68c2b1db8d9f319250cd0f8c
                      path:
                        type: string
                        example: /Users/yaldamahmoodi/Desktop/Git/Yaldoo/backmani/src/middlewares/uploads/profile-1757668980932-77093819.png
                      uploadedAt:
                        type: string
                        format: date-time
                        example: "2025-09-12T09:23:00.939Z"
                      __v:
                        type: integer
                        example: 0

  /api/v1/users/profile/posts:
    get:
      summary: Get user posts
      security:
        - cookieAuth: [ ]
      responses:
        '200':
          description: List of user posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: GET_POST_SUCCESSFULLY
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'

  /api/v1/users/upload/post:
    post:
      summary: Create post with photos
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                caption:
                  type: string
      responses:
        '201':
          description: Post created

  /api/v1/posts/getPost:
    get:
      summary: Get post by ID
      security:
        - cookieAuth: [ ]
      parameters:
        - name: postId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

  /api/v1/posts/{post_id}/savePost:
    post:
      summary: Save a post for the authenticated user
      security:
        - cookieAuth: [ ]
      parameters:
        - name: post_id
          in: path
          required: true
          schema:
            type: string
          description: ID of the post to save
      responses:
        '200':
          description: Post saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: SAVED_SUCCESSFULLY
                  message:
                    type: string
                    example: Post 123 saved successfully.
                  data:
                    type: object
                    description: Details of the saved post

  /api/v1/posts/{post_id}/unsavePost:
    post:
      summary: Unsave a post for the authenticated user
      security:
        - cookieAuth: [ ]
      parameters:
        - name: post_id
          in: path
          required: true
          schema:
            type: string
          description: ID of the post to unsave
      responses:
        '200':
          description: Post unsaved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UNSAVED_SUCCESSFULLY
                  message:
                    type: string
                    example: Post 123 unsaved successfully.
                  data:
                    type: object
                    description: Details of the unsaved post

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    RegisterDto:
      type: object
      required: [ email, username, password ]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 5
        password:
          type: string
          minLength: 8
        firstname:
          type: string
        lastname:
          type: string
        biography:
          type: string

    LoginDto:
      type: object
      required: [ username, password ]
      properties:
        username:
          type: string
          minLength: 5
        password:
          type: string
          minLength: 8

    UpdateProfileDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        biography:
          type: string

    Post:
      type: object
      properties:
        _id:
          type: string
          example: "64bfc67e2b3c5a001e9e8c21"
        user_id:
          type: string
          description: ID of the user who created the post
          example: "64bfc67e2b3c5a001e9e8c11"
        urls:
          type: array
          items:
            type: string
          example: [ "uploads/photo-1694582321.png" ]
        caption:
          type: string
          example: "My first post 🎉"
        photo_length:
          type: integer
          example: 3
        like_count:
          type: integer
          example: 10
        save_count:
          type: integer
          example: 5
        mentions:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
                example: "64bfc67e2b3c5a001e9e8c77"
              username:
                type: string
                example: "ali123"
        hashtag_array:
          type: array
          items:
            type: string
          example: [ "#fun", "#travel" ]
