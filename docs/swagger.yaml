openapi: 3.0.0
info:
  title: Rahnema
  version: 1.0.0
  description: API documentation for Auth, Users, and Posts
servers:
  - url: http://188.121.102.156
  - url: http://localhost:3001

paths:
  /api/health:
    get:
      summary: Health Check
      responses:
        '200':
          description: OK

  /api/v1/auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: "user@example.com"
                username:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: "username123"
                password:
                  type: string
                  minLength: 8
                  maxLength: 20
                  pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[\\W_]).{8,}$"
                  example: "StrongP@ssw0rd"
                firstname:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: "John"
                lastname:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: "Doe"
                biography:
                  type: string
                  maxLength: 1500
                  nullable: true
                  example: "I am a software developer."
              required:
                - email
                - username
                - password
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "USER_REGISTERED"
                  message:
                    type: string
                    example: "User created successfully"
        '400':
          description: Bad Request – Invalid input
        '500':
          description: Internal Server Error

  /api/v1/auth/login:
    post:
      summary: Login user
      description: Authenticate user and return access token in a HttpOnly cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User logged in successfully
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  userId:
                    type: string
                    example: 64f2a7b9e0c0f123456789ab

  /api/v1/users/profile:
    get:
      summary: Get user profile
      description: |
        برمی‌گردونه اطلاعات پروفایل کاربر.
        - اگر query param `id` ارسال بشه، پروفایل اون کاربر خاص رو برمی‌گردونه.
        - اگر ارسال نشه، پروفایل کاربر لاگین‌شده برگردونده میشه.
      security:
        - cookieAuth: [ ]
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: ID of the user (optional)
      responses:
        '200':
          description: User profile returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: GET_USER_SUCCESSFULLY
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                        example: johndoe
                      email:
                        type: string
                        format: email
                        example: johndoe@example.com
                      biography:
                        type: string
                        example: Software engineer and photographer
                      follower_count:
                        type: integer
                        example: 120
                      following_count:
                        type: integer
                        example: 85
                      post_count:
                        type: integer
                        example: 45
                      profilePhotoUrl:
                        type: string
                        nullable: true
                        example: /uploads/profile/johndoe.png

  /api/v1/users/profile/upload:
    post:
      summary: Upload profile photo
      description: Upload or update the authenticated user's profile photo.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - profile
              properties:
                profile:
                  type: string
                  format: binary
                  description: The profile photo file to upload
      responses:
        '201':
          description: Profile photo uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UPLOADED
                  message:
                    type: string
                    example: Profile upload success
                  data:
                    type: object
                    description: Details of the uploaded profile photo
                    properties:
                      _id:
                        type: string
                        example: 68c3e674d504d2ecea9e341f
                      user_id:
                        type: string
                        example: 68c2b1db8d9f319250cd0f8c
                      path:
                        type: string
                        example: /Users/yaldamahmoodi/Desktop/Git/Yaldoo/backmani/src/middlewares/uploads/profile-1757668980932-77093819.png
                      uploadedAt:
                        type: string
                        format: date-time
                        example: "2025-09-12T09:23:00.939Z"
                      __v:
                        type: integer
                        example: 0

  /api/v1/posts/getPosts:
    get:
      summary: Get user posts with pagination
      description: Retrieve paginated posts for a user. Optional query parameters `page` and `pageSize` control pagination.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: id
          schema:
            type: string
          required: false
          description: "Optional user ID. Defaults to the authenticated user if not provided."
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          required: false
          description: "Page number for pagination (default 1)."
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
          required: false
          description: "Number of posts per page (default 10, max 50)."
      responses:
        '200':
          description: List of user posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: GET_POST_SUCCESSFULLY
                  totalCount:
                    type: integer
                    example: 42
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
        '500':
          description: Internal server error


  /api/v1/users/upload/post:
    post:
      summary: Create post with photos
      tags:
        - Posts
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photos
              properties:
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: "Array of photo files (at least one required)"
                caption:
                  type: string
                  description: "Optional caption for the post"
                mentions:
                  type: array
                  items:
                    type: object
                    properties:
                      user_id:
                        type: string
                        description: "MongoDB ObjectId of mentioned user"
                      username:
                        type: string
                        description: "Username of mentioned user"
                  description: "Optional mentions"
                hashtag_array:
                  type: array
                  items:
                    type: string
                  description: "Optional extracted hashtags"
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: POST_CREATED_SUCCESS
                  message:
                    type: string
                    example: Post success
        '400':
          description: Validation error (e.g. no files uploaded)
        '401':
          description: Unauthorized


  /api/v1/posts/:post_id/getPost:
    get:
      summary: Get a single post by ID
      security:
        - cookieAuth: [ ]
      parameters:
        - in: path
          name: post_id
          schema:
            type: string
          required: true
          description: "ID of the post to retrieve"
      responses:
        '200':
          description: Post retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: GET_POST_SUCCESSFULLY
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: "68c4153c7187a49aafe14e71"
                      user_id:
                        type: string
                        example: "68c2b1db8d9f319250cd0f8c"
                      urls:
                        type: array
                        items:
                          type: string
                          example: "/uploads/posts/photos-1757680956872-723233089.png"
                      caption:
                        type: string
                        example: "jhdskjfhljds"
                      like_count:
                        type: integer
                        example: 0
                      save_count:
                        type: integer
                        example: 0
                      mentions:
                        type: array
                        items:
                          type: string
                        example: [ ]
                      hashtag_array:
                        type: array
                        items:
                          type: string
                        example: [ ]
                      photo_length:
                        type: integer
                        example: 2
        '404':
          description: Post not found
        '500':
          description: Internal server error

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    RegisterDto:
      type: object
      required: [ email, username, password ]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 5
        password:
          type: string
          minLength: 8
        firstname:
          type: string
        lastname:
          type: string
        biography:
          type: string

    LoginDto:
      type: object
      required: [ username, password ]
      properties:
        username:
          type: string
          minLength: 5
        password:
          type: string
          minLength: 8

    UpdateProfileDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        biography:
          type: string

    Post:
      type: object
      properties:
        _id:
          type: string
          example: "64bfc67e2b3c5a001e9e8c21"
        user_id:
          type: string
          description: ID of the user who created the post
          example: "64bfc67e2b3c5a001e9e8c11"
        urls:
          type: array
          items:
            type: string
          example: [ "uploads/photo-1694582321.png" ]
        caption:
          type: string
          example: "My first post 🎉"
        photo_length:
          type: integer
          example: 3
        like_count:
          type: integer
          example: 10
        save_count:
          type: integer
          example: 5
        mentions:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
                example: "64bfc67e2b3c5a001e9e8c77"
              username:
                type: string
                example: "ali123"
        hashtag_array:
          type: array
          items:
            type: string
          example: [ "#fun", "#travel" ]
