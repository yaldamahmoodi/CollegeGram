version: "3.9"

services:
  mongo:
    image: mongo:4.4
    container_name: collagegram-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: collagegram

    volumes:
      - mongo_data:/data/db

  elasticsearch:
    image: elasticsearch:8.19.3
    container_name: collagegram-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data

  api:
    build: ./apps/api
    container_name: monorepo-api
    restart: unless-stopped
    depends_on:
      - mongo
      - elasticsearch
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://admin:admin@mongo:27017/collagegram?authSource=admin
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PORT=3001


  web:
    build: ./apps/web
    container_name: monorepo-web
    restart: unless-stopped
    depends_on:
      - api



  nginx:
    image: nginx:1.25-alpine
    container_name: monorepo-nginx
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro


volumes:
  mongo_data:
  esdata:
