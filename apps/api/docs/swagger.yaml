                              type: string
                              example: 68d2b0927698eafb14b85ed9
                            email:
                              type: string
                              format: email
                              example: yaldoomaldoo101@gamil.com
                            username:
                              type: string
                              example: yaldoomaldoo1
                            firstname:
                              type: string
                              nullable: true
                              example: null
                            lastname:
                              type: string
                              nullable: true
                              example: null
                            profilePhoto:
                              type: string
                              nullable: true
                              example: null
        '401':
          description: Unauthorized (user not logged in)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Authentication required
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Something went wrong while fetching close friends

  /api/v1/search/getPosts/{page_number}/{query}:
    get:
      summary: Search posts
      description: |
        Returns paginated posts based on query (hashtags and captions).
        **Note:** Results automatically exclude posts from:
        - Users you have blocked
        - Users who have blocked you
      tags:
        - Posts
      security:
        - cookieAuth: [ ]
      parameters:
        - name: page_number
          in: path
          required: true
          description: Page number of the search results
          schema:
            type: integer
            example: 1
        - name: query
          in: path
          required: true
          description: The search query for posts
          schema:
            type: string
            example: "javascript"
      responses:
        "200":
          description: A list of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "monorepo/apps/api/src/db/models/post.model.ts"
        "400":
          description: Invalid parameters
        "500":
          description: Server error


components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    RegisterDto:
      type: object
      required: [ email, username, password ]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 5
        password:
          type: string
          minLength: 8
        firstname:
          type: string
        lastname:
          type: string
        biography:
          type: string

    LoginDto:
      type: object
      required: [ username, password ]
      properties:
        username:
          type: string
          minLength: 5
        password:
          type: string
          minLength: 8

    UpdateProfileDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        biography:
          type: string
        isPrivate:
          type: boolean

    BlockUserDto:
      type: object
      required:
        - blockUserId
      properties:
        blockUserId:
          type: string
          description: The ID of the user to block/unblock
          example: 68c6cbfd5bc774e86bdf4eb2

    User:
      type: object
      properties:
        _id:
          type: string
          example: "64bfc67e2b3c5a001e9e8c11"
        username:
          type: string
          example: "john_doe"
        firstname:
          type: string
          example: "John"
        lastname:
          type: string
          example: "Doe"
        ProfilePhoto:
          type: object
          nullable: true
          properties:
            _id:
              type: string
              example: "64bfc67e2b3c5a001e9e8c99"
            path:
              type: string
              example: "profile-1694582321.jpg"

    Post:
      type: object
      properties:
        _id:
          type: string
          example: "64bfc67e2b3c5a001e9e8c21"
        user_id:
          type: string
          description: ID of the user who created the post
          example: "64bfc67e2b3c5a001e9e8c11"
        urls:
          type: array
          items:
            type: string
          example: [ "uploads/photo-1694582321.png" ]
        caption:
          type: string
          example: "My first post 🎉"
        photo_length:
          type: integer
          example: 3
        like_count:
          type: integer
          example: 10
        save_count:
          type: integer
          example: 5
        mentions:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
                example: "64bfc67e2b3c5a001e9e8c77"
              username:
                type: string
                example: "ali123"
        hashtag_array:
          type: array
          items:
            type: string
          example: [ "#fun", "#travel" ]

    Notification:
      type: object
      properties:
        _id:
          type: string
          example: "64bfc67e2b3c5a001e9e8c21"
        recipientId:
          type: string
          example: "64bfc67e2b3c5a001e9e8c11"
        senderId:
          type: object
          properties:
            _id:
              type: string
              example: "64bfc67e2b3c5a001e9e8c22"
            username:
              type: string
              example: "john_doe"
            firstname:
              type: string
              example: "John"
            lastname:
              type: string
              example: "Doe"
        type:
          type: string
          enum: [like, comment, mention, follow, reply, save]
          example: "like"
          description: "Type of notification"
        postId:
          type: object
          nullable: true
          properties:
            _id:
              type: string
              example: "64bfc67e2b3c5a001e9e8c33"
            caption:
              type: string
              example: "Check out this amazing photo!"
            urls:
              type: array
              items:
                type: string
              example: ["uploads/photo-123.jpg"]
        commentId:
          type: object
          nullable: true
          properties:
            _id:
              type: string
              example: "64bfc67e2b3c5a001e9e8c44"
            content:
              type: string
              example: "Great post!"
        isRead:
          type: boolean
          example: false
        data:
          type: object
          properties:
            senderUsername:
              type: string
              example: "john_doe"
            postCaption:
              type: string
              nullable: true
              example: "Check out this amazing photo!"
            commentContent:
              type: string
              nullable: true
              example: "Great post!"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    PopulatedPost:
      type: object
      properties:
        _id:
          type: string
          example: "64bfc67e2b3c5a001e9e8c21"
        user_id:
          type: string
          description: ID of the user who created the post
          example: "64bfc67e2b3c5a001e9e8c11"
        user:
          $ref: '#/components/schemas/User'
        urls:
          type: array
          items:
            type: string
          example: [ "uploads/photo-1694582321.png" ]
        caption:
          type: string
          example: "My first post 🎉"
        photo_length:
          type: integer
          example: 3
        like_count:
          type: integer
          example: 10
        save_count:
          type: integer
          example: 5
        mentions:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
                example: "64bfc67e2b3c5a001e9e8c77"
              username:
                type: string
                example: "ali123"
        hashtag_array:
          type: array
          items:
            type: string
          example: [ "#fun", "#travel" ]
        isLiked:
          type: boolean
          description: Whether the authenticated user has liked this post
          example: true
        isSaved:
          type: boolean
          description: Whether the authenticated user has saved this post
          example: false
