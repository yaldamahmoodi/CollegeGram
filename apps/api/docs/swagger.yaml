                        createdAt:
                          type: string
                          format: date-time
                          example: 2025-09-28T15:19:34.812Z
                        updatedAt:
                          type: string
                          format: date-time
                          example: 2025-09-28T15:19:36.905Z
                        friend_info:
                          type: object
                          properties:
