  /api/v1/posts/explore:
    get:
      summary: Explore posts from followed users
      description: |
        Retrieve posts from users that the authenticated user follows.
        Posts are returned in chronological order (newest first) with pagination support.
        This endpoint provides a personalized feed based on the user's following list.
      tags:
        - Posts
      security:
        - cookieAuth: [ ]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination (default 1)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 10
          description: Number of posts per page (default 10, minimum 10)
      responses:
        '200':
          description: Posts from followed users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: EXPLORE_SUCCESSFULY
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        post_id:
                          type: string
                          example: 68c4153c7187a49aafe14e71
                        urls:
                          type: array
                          items:
                            type: string
                          example: ["/uploads/posts/photo-123.png", "/uploads/posts/photo-124.png"]
                        like_count:
                          type: integer
                          example: 15
                        save_count:
                          type: integer
                          example: 8
                        comment_count:
                          type: integer
                          example: 3
                        createdAt:
                          type: string
                          format: date-time
                          example: "2025-01-15T10:30:00.000Z"
                        userId:
                          type: string
                          example: 68c2b1db8d9f319250cd0f8c
                        firstname:
                          type: string
                          nullable: true
                          example: "John"
                        lastname:
                          type: string
                          nullable: true
                          example: "Doe"
                        following_count:
                          type: integer
                          example: 150
                        profilePhotoUrl:
                          type: string
                          nullable: true
                          example: "/uploads/profiles/profile-123.png"
        '401':
          description: Unauthorized – User not logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: User not authenticated
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Something went wrong while fetching explore posts

  /api/v1/posts/comment:
    post:
      summary: Add a comment to a post
      description: |
        یک کامنت جدید به پست اضافه می‌کند.  
        - در صورت ارسال `parent_comment`، کامنت به عنوان **ریپلای** ثبت می‌شود.  
        - نیاز به احراز هویت دارد.
      tags:
        - Comments
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - post_id
                - content
              properties:
                post_id:
                  type: string
                  description: شناسه پست
                  example: 68d50f8ca54197555078bf31
                content:
                  type: string
                  description: متن کامنت
                  example: this post is perfect
                parent_comment:
                  type: string
                  nullable: true
                  description: شناسه کامنت والد (برای ریپلای)
                  example: null
      responses:
        '201':
          description: Comment added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: COMMENT_ADDED_SUCCESSFULLY
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: 68d511b117a16012d74a14a0
                      post_id:
                        type: string
                        example: 68d50f8ca54197555078bf31
                      user_id:
                        type: string
                        example: 68d2acb57698eafb14b85ed4
                      content:
                        type: string
                        example: this post is perfect
                      like_count:
                        type: integer
                        example: 0
                      parent_comment:
                        type: string
                        nullable: true
                        example: null
                      createdAt:
                        type: string
                        format: date-time
                        example: 2025-09-25T09:56:01.038Z
                      updatedAt:
                        type: string
                        format: date-time
                        example: 2025-09-25T09:56:01.038Z
        '400':
          description: Bad request (invalid input)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INVALID_POST_ID
                  message:
                    type: string
                    example: Invalid post ID
        '401':
          description: Unauthorized – User not logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: User not authenticated


components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    RegisterDto:
      type: object
      required: [ email, username, password ]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 5
        password:
          type: string
          minLength: 8
        firstname:
          type: string
        lastname:
          type: string
        biography:
          type: string

    LoginDto:
      type: object
      required: [ username, password ]
      properties:
        username:
          type: string
          minLength: 5
        password:
          type: string
          minLength: 8

    UpdateProfileDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        biography:
          type: string

    Post:
      type: object
      properties:
        _id:
          type: string
          example: "64bfc67e2b3c5a001e9e8c21"
        user_id:
          type: string
          description: ID of the user who created the post
          example: "64bfc67e2b3c5a001e9e8c11"
        urls:
          type: array
          items:
            type: string
          example: [ "uploads/photo-1694582321.png" ]
        caption:
          type: string
          example: "My first post 🎉"
        photo_length:
          type: integer
          example: 3
        like_count:
          type: integer
          example: 10
        save_count:
          type: integer
          example: 5
        mentions:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
                example: "64bfc67e2b3c5a001e9e8c77"
              username:
                type: string
                example: "ali123"
        hashtag_array:
          type: array
          items:
            type: string
          example: [ "#fun", "#travel" ]
