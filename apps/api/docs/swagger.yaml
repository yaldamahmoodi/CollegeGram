openapi: 3.0.0
info:
  title: Rahnema
  version: 1.0.0
  description: API documentation for Auth, Users, and Posts
servers:
  - url: http://188.121.102.156
  - url: http://localhost:3001

paths:
  /api/health:
    get:
      summary: Health Check
      responses:
        '200':
          description: OK

  /api/v1/auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: "user@example.com"
                username:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: "username123"
                password:
                  type: string
                  minLength: 8
                  maxLength: 20
                  pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[\\W_]).{8,}$"
                  example: "StrongP@ssw0rd"
                firstname:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: "John"
                lastname:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: "Doe"
                biography:
                  type: string
                  maxLength: 1500
                  nullable: true
                  example: "I am a software developer."
              required:
                - email
                - username
                - password
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "USER_REGISTERED"
                  message:
                    type: string
                    example: "User created successfully"
        '400':
          description: Bad Request – Invalid input
        '500':
          description: Internal Server Error

  /api/v1/auth/login:
    post:
      summary: Login user
      description: Authenticate user and return access token in a HttpOnly cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User logged in successfully
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  userId:
                    type: string
                    example: 64f2a7b9e0c0f123456789ab

  /api/v1/users/profile:
    get:
      summary: Get user profile
      description: |
        برمی‌گردونه اطلاعات پروفایل کاربر.
        - اگر query param `id` ارسال بشه، پروفایل اون کاربر خاص رو برمی‌گردونه.
        - اگر ارسال نشه، پروفایل کاربر لاگین‌شده برگردونده میشه.
      security:
        - cookieAuth: [ ]
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: ID of the user (optional)
      responses:
        '200':
          description: User profile returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: GET_USER_SUCCESSFULLY
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                        example: johndoe
                      email:
                        type: string
                        format: email
                        example: johndoe@example.com
                      biography:
                        type: string
                        example: Software engineer and photographer
                      follower_count:
                        type: integer
                        example: 120
                      following_count:
                        type: integer
                        example: 85
                      post_count:
                        type: integer
                        example: 45
                      profilePhotoUrl:
                        type: string
                        nullable: true
                        example: /uploads/profile/johndoe.png

  /api/v1/users/{username}:
    get:
      summary: Get other user's profile
      description: |
        پروفایل یک کاربر دیگر را بر اساس **username** برمی‌گرداند.
        - اگر کاربر لاگین کرده باشد، فیلد `isFollowed` مشخص می‌کند که آیا کاربر جاری این کاربر را فالو کرده یا نه.
      tags:
        - Users
      security:
        - cookieAuth: [ ]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          description: Username of the target user
          example: yaldoomaldoo1
      responses:
        '200':
          description: User profile returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: GET_USER_PROFILE_SUCCESSFULLY
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                        example: 68d2b0927698eafb14b85ed9
                      username:
                        type: string
                        example: yaldoomaldoo1
                      email:
                        type: string
                        format: email
                        example: yaldoomaldoo101@gamil.com
                      firstname:
                        type: string
                        nullable: true
                        example: null
                      lastname:
                        type: string
                        nullable: true
                        example: null
                      biography:
                        type: string
                        nullable: true
                        example: null
                      follower_count:
                        type: integer
                        example: 1
                      following_count:
                        type: integer
                        example: 0
                      post_count:
                        type: integer
                        example: 0
                      profilePhotoUrl:
                        type: string
                        nullable: true
                        example: null
                      isFollowed:
                        type: boolean
                        example: true
        '401':
          description: Unauthorized (user not logged in)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Authentication required
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND_USER
                  message:
                    type: string
                    example: User with given username does not exist



  /api/v1/users/profile/upload:
    post:
      summary: Upload profile photo
      description: Upload or update the authenticated user's profile photo.
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - profile
              properties:
                profile:
                  type: string
                  format: binary
                  description: The profile photo file to upload
      responses:
        '201':
          description: Profile photo uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UPLOADED
                  message:
                    type: string
                    example: Profile upload success
                  data:
                    type: object
                    description: Details of the uploaded profile photo
                    properties:
                      _id:
                        type: string
                        example: 68c3e674d504d2ecea9e341f
                      user_id:
                        type: string
                        example: 68c2b1db8d9f319250cd0f8c
                      path:
                        type: string
                        example: /Users/yaldamahmoodi/Desktop/Git/Yaldoo/backmani/src/middlewares/uploads/profile-1757668980932-77093819.png
                      uploadedAt:
                        type: string
                        format: date-time
                        example: "2025-09-12T09:23:00.939Z"
                      __v:
                        type: integer
                        example: 0

  /api/v1/posts/getPosts:
    get:
      summary: Get user posts with pagination
      description: Retrieve paginated posts for a user. Optional query parameters `page` and `pageSize` control pagination.
      security:
        - cookieAuth: [ ]
      parameters:
        - in: query
          name: id
          schema:
            type: string
          required: false
          description: "Optional user ID. Defaults to the authenticated user if not provided."
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          required: false
          description: "Page number for pagination (default 1)."
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
          required: false
          description: "Number of posts per page (default 10, max 50)."
      responses:
        '200':
          description: List of user posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: GET_POST_SUCCESSFULLY
                  totalCount:
                    type: integer
                    example: 42
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
        '500':
          description: Internal server error


  /api/v1/users/upload/post:
    post:
      summary: Create post with photos
      tags:
        - Posts
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photos
              properties:
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: "Array of photo files (at least one required)"
                caption:
                  type: string
                  description: "Optional caption for the post"
                mentions:
                  type: array
                  items:
                    type: object
                    properties:
                      user_id:
                        type: string
                        description: "MongoDB ObjectId of mentioned user"
                      username:
                        type: string
                        description: "Username of mentioned user"
                  description: "Optional mentions"
                hashtag_array:
                  type: array
                  items:
                    type: string
                  description: "Optional extracted hashtags"
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: POST_CREATED_SUCCESS
                  message:
                    type: string
                    example: Post success
        '400':
          description: Validation error (e.g. no files uploaded)
        '401':
          description: Unauthorized


  /api/v1/posts/:post_id/getPost:
    get:
      summary: Get a single post by ID
      security:
        - cookieAuth: [ ]
      parameters:
        - in: path
          name: post_id
          schema:
            type: string
          required: true
          description: "ID of the post to retrieve"
      responses:
        '200':
          description: Post retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: GET_POST_SUCCESSFULLY
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: "68c4153c7187a49aafe14e71"
                      user_id:
                        type: string
                        example: "68c2b1db8d9f319250cd0f8c"
                      urls:
                        type: array
                        items:
                          type: string
                          example: "/uploads/posts/photos-1757680956872-723233089.png"
                      caption:
                        type: string
                        example: "jhdskjfhljds"
                      like_count:
                        type: integer
                        example: 0
                      save_count:
                        type: integer
                        example: 0
                      mentions:
                        type: array
                        items:
                          type: string
                        example: [ ]
                      hashtag_array:
                        type: array
                        items:
                          type: string
                        example: [ ]
                      photo_length:
                        type: integer
                        example: 2
        '404':
          description: Post not found
        '500':
          description: Internal server error

  /api/v1/users/profile/update:
    patch:
      summary: Update user profile
      description: Update profile fields such as email, password, firstname, lastname, and biography.
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: "newemail@example.com"
                password:
                  type: string
                  description: >
                    Password must include at least one lowercase letter, one uppercase letter,
                    one digit, and one special character. Maximum length: 20.
                  maxLength: 20
                  example: "NewP@ssword1"
                firstname:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: "Yalda"
                lastname:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: "Mahmoodi"
                biography:
                  type: string
                  maxLength: 1500
                  nullable: true
                  example: "This is my new bio"
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: USER_UPDATED_SUCCESS
                  message:
                    type: string
                    example: User successfully Updated
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                        example: 68c2b1db8d9f319250cd0f8c
                      username:
                        type: string
                        example: yaldoo1234
                      firstname:
                        type: string
                        nullable: true
                        example: yaldoo
                      lastname:
                        type: string
                        nullable: true
                        example: null
                      email:
                        type: string
                        example: yaldoomaldoo@gamil.com
                      biography:
                        type: string
                        nullable: true
                        example: null
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INVALID_CREDENTIALS
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          example: ""
                        message:
                          type: string
                          example: "Invalid input: expected object, received undefined"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND_USER
  /api/v1/posts/like:
    post:
      summary: Like a post
      description: Add a like to a specific post for the authenticated user.
      tags:
        - Posts
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - postId
              properties:
                postId:
                  type: string
                  description: The ID of the post to like
                  example: 68c416ecf90cd074f701a4f4
      responses:
        '200':
          description: Post liked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: LIKED_SUCCESSFULY
                  message:
                    type: string
                    example: post 68c416ecf90cd074f701a4f4 liked successfully.
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND_POST
                  message:
                    type: string
                    example: Post with given ID does not exist
        '409':
          description: Post already liked
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: ALREADY_DONE
                  details:
                    type: string
                    example: post liked before
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Something went wrong while liking the post.

  /api/v1/posts/{post_id}/unLike:
    post:
      summary: Unlike a post
      description: Remove a like from a specific post for the authenticated user by its ID.
      tags:
        - Posts
      security:
        - cookieAuth: [ ]
      parameters:
        - name: post_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the post to unlike
          example: 68c416ecf90cd074f701a4f4
      responses:
        '200':
          description: Post unliked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UNLIKED_SUCCESSFULY
                  message:
                    type: string
                    example: post 68c416ecf90cd074f701a4f4 unliked successfully.
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND_POST
                  message:
                    type: string
                    example: Post with given ID does not exist
        '409':
          description: Post already unliked
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: ALREADY_DONE
                  details:
                    type: string
                    example: post unliked before
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Something went wrong while unliking the post.

  /api/v1/posts/save:
    post:
      summary: Save a post
      description: Save a specific post by its ID for the authenticated user.
      tags:
        - Posts
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - postId
              properties:
                postId:
                  type: string
                  description: The ID of the post to save
                  example: 68c416ecf90cd074f701a4f4
      responses:
        '200':
          description: Post saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: SAVED_SUCCESSFULLY
                  message:
                    type: string
                    example: Post 68c416ecf90cd074f701a4f4 saved successfully.
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND_POST
                  message:
                    type: string
                    example: Post with given ID does not exist
        '409':
          description: Post already saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: ALREADY_SAVED
                  details:
                    type: string
                    example: post already saved
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Something went wrong while saving the post.

  /api/v1/posts/unsave:
    post:
      summary: Unsave a post
      description: Remove a saved post for the authenticated user by its ID.
      tags:
        - Posts
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - postId
              properties:
                postId:
                  type: string
                  description: The ID of the post to unsave
                  example: 68c416ecf90cd074f701a4f4
      responses:
        '200':
          description: Post unsaved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UNSAVED_SUCCESSFULLY
                  message:
                    type: string
                    example: Post 68c416ecf90cd074f701a4f4 unsaved successfully.
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND_POST
                  message:
                    type: string
                    example: Post with given ID does not exist
        '409':
          description: Post already unsaved
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: ALREADY_DONE
                  details:
                    type: string
                    example: post already unsaved
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Something went wrong while unsaving the post.

  /api/v1/users/follow:
    post:
      summary: Follow a user
      description: Follow another user by their user ID.
      tags:
        - Users
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - followedUserId
              properties:
                followedUserId:
                  type: string
                  description: The ID of the user to follow
                  example: 68c6cbfd5bc774e86bdf4eb2
      responses:
        '200':
          description: User followed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: USER_FOLLOWED
                  message:
                    type: string
                    example: User successfully Followed
        '400':
          description: Invalid follow request (e.g., trying to follow yourself)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: YOU_CANNOT_FOLLOW_YOURSELF
                  message:
                    type: string
                    example: You cannot follow yourself
        '404':
          description: Target user not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND_USER
                  message:
                    type: string
                    example: User with given ID does not exist
        '409':
          description: User already followed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: ALREADY_DONE
                  details:
                    type: string
                    example: user followed before

  /api/v1/users/unfollow:
    post:
      summary: Unfollow a user
      description: Unfollow another user by their user ID.
      tags:
        - Users
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - unfollowedUserId
              properties:
                unfollowedUserId:
                  type: string
                  description: The ID of the user to unfollow
                  example: 68c6cbfd5bc774e86bdf4eb2
      responses:
        '200':
          description: User unfollowed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: USER_UNFOLLOWED
                  message:
                    type: string
                    example: User successfully Unfollowed
        '400':
          description: Invalid unfollow request (e.g., trying to unfollow yourself)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: YOU_CANNOT_UNFOLLOW_YOURSELF
                  message:
                    type: string
                    example: You cannot unfollow yourself
        '404':
          description: Target user not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND_USER
                  message:
                    type: string
                    example: User with given ID does not exist
        '409':
          description: User already unfollowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: ALREADY_DONE
                  details:
                    type: string
                    example: user unfollowed before

  /api/v1/users/savesList:
    get:
      summary: Get saved posts for authenticated user
      description: Retrieve a paginated list of posts saved by the authenticated user.
      tags:
        - Posts
      security:
        - cookieAuth: [ ]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Number of posts per page
      responses:
        '200':
          description: List of saved posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: GET_SAVED_POSTS_SUCCESS
                  totalCount:
                    type: integer
                    example: 2
                  savedPosts:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: 68c7102afd7dc7e1b89489a3
                        postOwner:
                          type: string
                          example: yaldoo1234
                        createdAt:
                          type: string
                          format: date-time
                          example: 2025-09-14T18:57:46.388Z
                        updatedAt:
                          type: string
