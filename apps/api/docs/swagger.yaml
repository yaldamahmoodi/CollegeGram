                      type: object
                      properties:
                        _id:
                          type: string
                          example: 68d511b117a16012d74a14a0
                        post_id:
                          type: string
                          example: 68d50f8ca54197555078bf31
                        user_id:
                          type: string
                          example: 68d2acb57698eafb14b85ed4
                        content:
                          type: string
                          example: this post is perfect
                        like_count:
                          type: integer
                          example: 0
                        parent_comment:
                          type: string
                          nullable: true
                          example: null
                        createdAt:
                          type: string
                          format: date-time
                          example: 2025-09-25T09:56:01.038Z
                        updatedAt:
                          type: string
                          format: date-time
                          example: 2025-09-25T09:56:01.038Z
        '401':
          description: Unauthorized (user not logged in)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Authentication required
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND
                  message:
                    type: string
                    example: Post with given ID does not exist

  /api/v1/posts/comment/like:
    post:
      summary: Like a comment
      description: Like a comment by its ID. Requires authentication.
      tags:
        - Comments
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - commentId
              properties:
                commentId:
                  type: string
                  description: ID of the comment to like
                  example: 68d511b117a16012d74a14a0
      responses:
        '200':
          description: Comment liked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: LIKED_SUCCESSFULY
                  message:
                    type: string
                    example: comment 68d511b117a16012d74a14a0 liked successfully.
        '401':
          description: Unauthorized (user not logged in)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Authentication required
        '404':
          description: Comment not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND
                  details:
                    type: string
                    example: Comment_not_find
        '409':
          description: Comment already liked by the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: ALREADY_DONE
                  details:
                    type: string
                    example: User_liked_comment_Before

  /api/v1/posts/comment/unlike:
    post:
      summary: Unlike a comment
      description: Remove a like from a comment by its ID. Requires authentication.
      tags:
        - Comments
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - commentId
              properties:
                commentId:
                  type: string
                  description: ID of the comment to unlike
                  example: 68d511b117a16012d74a14a0
      responses:
        '200':
          description: Comment unliked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UNLIKED_SUCCESSFULY
                  message:
                    type: string
                    example: comment 68d511b117a16012d74a14a0 unliked successfully.
        '401':
          description: Unauthorized (user not logged in)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Authentication required
        '404':
          description: Comment not found or not liked by the user
          content:
            application/json:
              schema:
                type: object
                oneOf:
                  - type: object
                    properties:
                      code:
                        type: string
                        example: NOT_FOUND
                      details:
                        type: string
                        example: Comment_not_find
                  - type: object
                    properties:
                      code:
                        type: string
                        example: NO_DATA_PROVIDED
                      details:
                        type: string
                        example: User_Doesnt_liked_comment_Before

  /api/v1/search/getUsers/{page_number}/{query}:
    get:
      summary: Search users (paginated)
      description: |
        Returns 10 users per page.
        **Note:** Results automatically exclude:
        - Users you have blocked
        - Users who have blocked you
      tags:
        - Search
      security:
        - cookieAuth: [ ]
      parameters:
        - name: page_number
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: The page number to retrieve
          example: 1
        - name: query
          in: path
          required: true
          schema:
            type: string
          description:
          example: mohammad
      responses:
        '200':
          description: Successful response with users
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount:
                    type: integer
                    example: 5
                  page:
                    type: integer
                    example: 1
                  perPage:
                    type: integer
                    example: 10
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        username:
                          type: string
                          example: mohammad95
                        firstName:
                          type: string
                          example: mohammad
                        lastName:
                          type: string
                          example: asghari
                        profilePhoto:
                          type: string
                          format: uri
                          example: "monorepo/apps/api/src/middleware/uploads/m2.jpg"
                        followersCount:
                          type: integer
                          example: 320
        '500':
          description: Internal server error

  /api/v1/closeFriend/add:
    post:
      summary: Add a user to close friends
      description: |
        کاربر لاگین‌شده می‌تواند یک کاربر دیگر را به لیست **دوستان نزدیک** اضافه کند.
      tags:
        - CloseFriends
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - friendId
              properties:
                friendId:
                  type: string
                  description: ID of the user to add as a close friend
                  example: 68d6cbfd5bc774e86bdf4eb2
      responses:
        '201':
          description: Friend added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: FRIEND_ADDED_SUCCESS
                  message:
                    type: string
                    example: Friend added to close friends successfully.
        '400':
          description: Cannot add yourself to close friends
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: CAN_NOT_ADD_YOURSELF_TO_CLOSE_FRIEND
                  message:
                    type: string
                    example: You cannot add yourself to close friends
        '401':
          description: Unauthorized (user not logged in)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Authentication required
        '409':
          description: Already exists in close friends
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: ALREADY_DONE
                  details:
                    type: string
                    example: user already exists in closeFriend
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Something went wrong while adding to close friends

  /api/v1/closeFriend/remove:
    post:
      summary: Remove a user from close friends
      description: |
        کاربر لاگین‌شده می‌تواند یک کاربر دیگر را از لیست **دوستان نزدیک** خودش حذف کند.
      tags:
        - CloseFriends
      security:
        - cookieAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - friendId
              properties:
                friendId:
                  type: string
                  description: ID of the user to remove from close friends
                  example: 68d6cbfd5bc774e86bdf4eb2
      responses:
        '200':
          description: Friend removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: FRIEND_REMOVED_SUCCESS
                  message:
                    type: string
                    example: Friend removed from close friends successfully.
        '401':
          description: Unauthorized (user not logged in)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Authentication required
        '404':
          description: Friend not found in close friends list
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND
                  message:
                    type: string
                    example: user does not exists in closeFriend
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Something went wrong while removing from close friends

  /api/v1/closeFriend/list:
